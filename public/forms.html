<!--
  This file exists only so Netlify's build-time bot can detect and register
  these forms (Netlify scans static HTML, not client-rendered React).
  It is never linked to or shown to visitors.
-->
<form name="contact" netlify netlify-honeypot="bot-field" hidden>
  <input type="text" name="name" />
  <input type="email" name="email" />
  <input type="text" name="subject" />
  <textarea name="message"></textarea>
</form>

<form name="booking" netlify netlify-honeypot="bot-field" hidden>
  <input type="text" name="name" />
  <input type="email" name="email" />
  <input type="text" name="phone" />
  <input type="text" name="eventType" />
  <input type="text" name="message" />
  <input type="text" name="preferredDate" />
  <input type="text" name="preferredTime" />
</form>
